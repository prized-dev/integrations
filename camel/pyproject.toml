[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "camel-prized"
dynamic = ["version"]
description = "Prized Sandboxes for CAMEL: an interpreter, a runtime and a code-execution toolkit that run in a Firecracker microVM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
authors = [{ name = "Prized", email = "team@prized.dev" }]
keywords = ["camel", "camel-ai", "agents", "ai", "sandbox", "code-interpreter", "prized", "microvm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "camel-ai>=0.2.86,<0.3",
  "prized>=0.1.2,<0.2",
  # camel-ai 0.2.90 (the latest release) allows any mcp, and its toolkits fail to import with mcp 2
  # (no mcp.server.FastMCP); its next release pins mcp<2 itself.
  "mcp>=1.3,<2",
  # Importing camel.runtimes (for BaseRuntime) imports its Docker runtime, which needs these;
  # camel-ai itself doesn't require them.
  "requests>=2.28",
  "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[project.urls]
Homepage = "https://prized.dev/sandboxes?via=camel"
Documentation = "https://prized.dev/docs/sandboxes?via=camel"
Source = "https://github.com/prized-dev/integrations/tree/main/camel"
Issues = "https://github.com/prized-dev/integrations/issues"

[tool.hatch.version]
path = "src/camel_prized/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/camel_prized"]

[tool.hatch.build.targets.sdist]
include = ["src/camel_prized", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["camel.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: talks to the real Prized API (needs PRIZED_API_KEY and PRIZED_LIVE=1)"]
