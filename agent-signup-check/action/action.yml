# The agent sign-up check (../README.md) as a step: prized.dev runs the seven checks against your
# domain, the step prints them to the job summary with a link to your row, and fails when a check
# breaks. Prized wrote the check and the spend-limits draft two of the checks accept.
name: Agent sign-up check
description: Can an AI agent sign up for your platform, pay and use it on its own? Runs Prized's seven checks against your domain and fails when one breaks.
author: Prized
branding:
  icon: check-circle
  color: gray-dark

inputs:
  domain:
    description: The domain to check, like example.com.
    required: true
  api:
    description: >-
      One endpoint of your API that needs a key, on the domain or a subdomain of it. The check calls
      it without one, to see how a signed-out agent is turned away. Leave it empty for a platform on
      the prized.dev board (its row's endpoint is used) or to try https://api.<domain>/.
    required: false
    default: ''
  fail-on:
    description: >-
      When the step fails. any-regression: a check is worse than your row on prized.dev (a domain
      that isn't on the board has no row, so nothing fails). below-score N: fewer than N of the
      seven checks pass. never: report only. A rate limit, an outage or a network error never fails
      the step; inputs prized.dev refuses always do.
    required: false
    default: any-regression
  fresh:
    description: >-
      true checks now. false accepts an answer up to 10 minutes old. prized.dev allows 4 fresh
      checks of one domain from one address in 10 minutes; past that the step warns and passes.
    required: false
    default: 'true'

outputs:
  status:
    description: checked, rate-limited, unavailable (no answer, or not one the step understands) or invalid (inputs refused).
    value: ${{ steps.check.outputs.status }}
  score:
    description: Checks passed of the checks that ran, like 5/7. Empty when nothing was checked.
    value: ${{ steps.check.outputs.score }}
  passed:
    description: How many checks passed, like 5.
    value: ${{ steps.check.outputs.passed }}
  total:
    description: How many checks ran (7, or 6 when the API was not probed).
    value: ${{ steps.check.outputs.total }}
  failed:
    description: The checks that failed (not partly), comma-separated ids, like limits,payment.
    value: ${{ steps.check.outputs.failed }}
  regressions:
    description: The checks worse than your row on prized.dev, comma-separated ids.
    value: ${{ steps.check.outputs.regressions }}
  row:
    description: Your row on prized.dev, or the page with your domain filled in.
    value: ${{ steps.check.outputs.row }}
  result:
    description: Path to the full answer as JSON (every verdict, reason and request).
    value: ${{ steps.check.outputs.result }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_API: ${{ inputs.api }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FRESH: ${{ inputs.fresh }}
      run: |
        if ! command -v node >/dev/null; then
          echo "::error title=Agent sign-up check::This step needs Node 18 or later on the runner (GitHub-hosted runners have it; elsewhere add actions/setup-node first)."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/run.mjs"
