identity:
  author: prized
  name: prized_sandboxes
  label:
    en_US: Prized Sandboxes
  description:
    en_US: Run commands, code and files in Prized Sandboxes, Linux microVMs that pause and resume.
  icon: icon.svg
  tags:
    - utilities
    - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Prized API key
    placeholder:
      en_US: dcp_...
    help:
      en_US: 'A Custom key with only Sandboxes: Write, and an expiry, from prized.dev under Settings, API keys.'
    url: https://prized.dev/dashboard/workspace/api-keys
  dify_files_url:
    type: text-input
    required: false
    label:
      en_US: Dify file URL (self-hosted Dify only)
    placeholder:
      en_US: http://api:5001
    help:
      en_US: For Upload file on a self-hosted Dify that gives plugins a private file address. Enter Dify's
        INTERNAL_FILES_URL (or FILES_URL if that is unset), such as http://api:5001, and Upload file also
        fetches files under its /files/ path. Leave empty on Dify Cloud.
tools:
  - tools/create_sandbox.yaml
  - tools/run_command.yaml
  - tools/run_code.yaml
  - tools/write_file.yaml
  - tools/upload_file.yaml
  - tools/read_file.yaml
  - tools/get_sandbox.yaml
  - tools/pause_sandbox.yaml
  - tools/resume_sandbox.yaml
  - tools/delete_sandbox.yaml
extra:
  python:
    source: provider/prized.py
