# Lint and offline tests for every integration. No secrets: nothing here talks to the Prized API.
# scripts/test.sh is the same script contributors run locally, and it cuts the network off (loopback
# stays up) while the tests run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.dir }} (${{ matrix.python || matrix.node && format('node {0}', matrix.node) || 'bash' }}${{ matrix.floor && ', oldest deps' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: inspect, python: "3.10", floor: true }
          - { dir: inspect, python: "3.13" }
          - { dir: adk, python: "3.10", floor: true }
          - { dir: adk, python: "3.13" }
          - { dir: strands, python: "3.10", floor: true }
          - { dir: strands, python: "3.13" }
          - { dir: agent-framework, python: "3.10", floor: true }
          - { dir: agent-framework, python: "3.13" }
          - { dir: pydantic-ai, python: "3.11", floor: true }
          - { dir: pydantic-ai, python: "3.13" }
          - { dir: harbor, python: "3.12", floor: true }
          - { dir: harbor, python: "3.13" }
          - { dir: devin-outposts, python: "3.10", floor: true }
          - { dir: devin-outposts, python: "3.13" }
          - { dir: openai-agents, python: "3.10", floor: true }
          - { dir: openai-agents, python: "3.13" }
          - { dir: openai-agents, python: "3.14" }
          - { dir: hermes, python: "3.12" }
          - { dir: dify, python: "3.12" }
          - { dir: cursor }
          - { dir: conductor, python: "3.12" }
          - { dir: github-issues, python: "3.10" }
          - { dir: github-issues, python: "3.13" }
          - { dir: claude-managed-agents }
          - { dir: langchain-js, node: "22" }
          - { dir: langchain-js, node: "24" }
          - { dir: paseo, node: "22" }
          - { dir: paseo, node: "24" }
          - { dir: mastra, node: "22", floor: true }
          - { dir: mastra, node: "24" }
          - { dir: agent-signup-check, node: "18" }
          - { dir: agent-signup-check, node: "24" }
          - { dir: herdr, node: "22" }
          - { dir: herdr, node: "24" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: scripts/test.sh ${{ matrix.dir }}
        env:
          PYTHON: python
          FLOOR: ${{ matrix.floor && '1' || '' }}

  # The GitHub Action (agent-signup-check/action) as a workflow uses it, against the API answers
  # recorded in agent-signup-check/test/action-fixtures, served on 127.0.0.1: inputs in, outputs
  # out, a regression failing the step and a rate limit only warning.
  agent-signup-check-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Serve the recorded answers on 127.0.0.1
        run: |
          node agent-signup-check/test/action-fixtures/serve.mjs > "$RUNNER_TEMP/fixtures.log" 2>&1 &
          for _ in $(seq 50); do grep -q '^PORT ' "$RUNNER_TEMP/fixtures.log" && break; sleep 0.1; done
          port=$(sed -n 's/^PORT //p' "$RUNNER_TEMP/fixtures.log")
          test -n "$port"
          echo "AGENT_SIGNUP_CHECK_URL=http://127.0.0.1:$port/api/agent-signup-check" >> "$GITHUB_ENV"
      - id: pass
        uses: ./agent-signup-check/action
        with:
          domain: prized.dev
      - id: regression
        continue-on-error: true
        uses: ./agent-signup-check/action
        with:
          domain: polar.sh
      - id: limited
        uses: ./agent-signup-check/action
        with:
          domain: rate-limited.example
          fail-on: below-score 7
      - name: Outputs and outcomes
        env:
          PASS_SCORE: ${{ steps.pass.outputs.score }}
          PASS_FAILED: ${{ steps.pass.outputs.failed }}
          PASS_ROW: ${{ steps.pass.outputs.row }}
          PASS_RESULT: ${{ steps.pass.outputs.result }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          REGRESSIONS: ${{ steps.regression.outputs.regressions }}
          LIMITED_OUTCOME: ${{ steps.limited.outcome }}
          LIMITED_STATUS: ${{ steps.limited.outputs.status }}
        run: |
          set -x
          test "$PASS_SCORE" = 5/7
          test "$PASS_FAILED" = limits
          test "$PASS_ROW" = "https://prized.dev/agent-signup-check?via=github-action#prized.dev"
          test -s "$PASS_RESULT"
          test "$REGRESSION_OUTCOME" = failure
          test "$REGRESSIONS" = markdown
          test "$LIMITED_OUTCOME" = success
          test "$LIMITED_STATUS" = rate-limited

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: >-
          shellcheck scripts/test.sh claude-managed-agents/on-work.sh claude-managed-agents/test/test.sh
          cursor/spawn.sh cursor/test/test.sh cursor/test/stub-agent cursor/test/sandbox-bin/curl
          herdr/test/fakes/herdr herdr/test/fakes/ssh
          conductor/move.sh conductor/test/test.sh conductor/test/fake-prized conductor/test/box-bin/tmux
