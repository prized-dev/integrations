[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harbor-prized"
version = "0.2.0"
description = "Prized Sandboxes as a Harbor environment: run Terminal-Bench and other Harbor tasks in Firecracker microVMs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Prized", email = "team@prized.dev" }]
keywords = ["harbor", "terminal-bench", "prized", "sandbox", "evals"]
dependencies = ["harbor>=0.24", "prized>=0.1.1,<0.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://prized.dev/sandboxes?via=harbor"
Documentation = "https://prized.dev/docs/sandboxes?via=harbor"
Source = "https://github.com/prized-dev/integrations/tree/main/harbor"
Issues = "https://github.com/prized-dev/integrations/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_prized"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
