[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-framework-prized"
dynamic = ["version"]
description = "Prized Sandboxes for the Microsoft Agent Framework: run an agent's shell commands in a Firecracker microVM that pauses and forks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Prized", email = "team@prized.dev" }]
keywords = ["agent-framework", "microsoft-agent-framework", "agents", "ai", "shell", "sandbox", "prized", "microvm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "agent-framework-core>=1.19.0,<2",
  "agent-framework-tools>=1.0.0b260918,<2",
  "prized>=0.1.1,<0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-timeout>=2.3", "ruff>=0.11", "mypy>=1.15"]

[project.urls]
Homepage = "https://github.com/prized-dev/integrations/tree/main/agent-framework#readme"
Documentation = "https://github.com/prized-dev/integrations/tree/main/agent-framework#readme"
Source = "https://github.com/prized-dev/integrations/tree/main/agent-framework"
Issues = "https://github.com/prized-dev/integrations/issues"

[tool.hatch.version]
path = "src/agent_framework_prized/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_prized"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = ["live: talks to the real Prized API (needs PRIZED_API_KEY and PRIZED_LIVE=1)"]
