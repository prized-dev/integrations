[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prized-managed-agents"
dynamic = ["version"]
description = "Serve a Claude Managed Agents self-hosted environment with Prized Sandboxes: one Firecracker microVM per session, started by a webhook, paused with its memory between runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Prized", email = "team@prized.dev" }]
keywords = ["claude", "managed-agents", "anthropic", "self-hosted", "sandbox", "prized", "microvm", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["prized>=0.1.3,<0.2", "httpx>=0.24,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
# standardwebhooks is the library Anthropic's SDK verifies deliveries with; the tests check ours against it.
test = ["pytest>=8", "standardwebhooks>=1.0,<2"]
dev = ["pytest>=8", "standardwebhooks>=1.0,<2", "ruff>=0.6"]

[project.scripts]
prized-managed-agents = "prized_managed_agents.cli:main"

[project.urls]
Homepage = "https://prized.dev/sandboxes?via=claude-managed-agents-orchestrator"
Source = "https://github.com/prized-dev/integrations/tree/main/claude-managed-agents-orchestrator"
Issues = "https://github.com/prized-dev/integrations/issues"

[tool.hatch.version]
path = "src/prized_managed_agents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prized_managed_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real keys and PRIZED_LIVE=1; creates real sandboxes and sessions"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
