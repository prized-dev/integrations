[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openhands-prized"
dynamic = ["version"]
description = "Run the OpenHands Agent Server in Prized Sandboxes: a remote workspace for the OpenHands SDK and a backend for Agent Canvas."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Prized", email = "team@prized.dev" }]
keywords = ["openhands", "agent-canvas", "prized", "sandbox", "workspace", "coding-agents"]
dependencies = [
  "openhands-sdk>=1.59.0",
  "prized>=0.1.1",
  "httpx>=0.27",
  "websockets>=12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openhands-prized = "openhands_prized.cli:main"

[project.urls]
Homepage = "https://prized.dev/sandboxes?via=openhands"
Documentation = "https://github.com/prized-dev/integrations/tree/main/openhands#readme"
Source = "https://github.com/prized-dev/integrations/tree/main/openhands"
Issues = "https://github.com/prized-dev/integrations/issues"

[tool.hatch.version]
path = "src/openhands_prized/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands_prized"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Best-effort cleanup and the proxy's error answers catch everything on purpose.
ignore = ["BLE001", "S110"]
