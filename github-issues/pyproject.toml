# Lint settings only: prized_issues.py is a single standard-library script, not a package.
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL", "RUF"]
ignore = [
    "S603", "S607",  # it runs git, systemctl and the agents by name, with argument lists
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    "UP045", "UP007",  # keep X | None in annotations (from __future__ import annotations)
    "PLW1510",       # return codes are checked by hand
    "PLW2901",
    "PLW1514",       # files hold ASCII the script wrote itself
    "SIM115",
    "E501",          # the formatter wraps code; long user-facing strings stay whole
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S108", "E402", "PLC0415", "RUF059", "S105", "S106", "S107", "N801"]
